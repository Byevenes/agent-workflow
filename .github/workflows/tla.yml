name: tla
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          curl -sSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c
      - working-directory: docs/statechart
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -config ZStackTextOnly.cfg ZStack.tla
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -config ZStackHooked.cfg ZStack.tla
